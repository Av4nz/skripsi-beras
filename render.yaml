services:
  - type: web
    name: skripsi-beras-backend
    runtime: python
    rootDir: backend
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.3
      # Set the value in the Render dashboard (marked secret / sync:false).
      - key: DATABASE_URL
        sync: false
      # Comma-separated list of allowed frontend origins, e.g.
      # http://localhost:3000,https://your-frontend.vercel.app
      - key: CORS_ORIGINS
        sync: false
